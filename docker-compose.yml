services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: skillquest
    ports: ["3307:3306"]  
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      DB_URL: jdbc:mysql://db:3306/skillquest
      DB_USERNAME: skillquest_user
      DB_PASSWORD: user
      JWT_SECRET: zubxvcSbyPc//vorPrj3YSTCUamudF67hZLcg74dkUA=
      CORS_ORIGIN: http://localhost:5173
    ports: ["8080:8080"]

volumes:
  db_data: