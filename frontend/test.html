<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./public/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./src/styles/style.css">
    <link rel="stylesheet" href="./src/styles/login.css">
    <title>SKILLEARN</title>
  </head>
  <body>
    <div class="login-page">
      <div class="site-info">
        <div class="brand">
          <div class="brand-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" class="logo">
              <g transform="scale(1.6) translate(5, 3)">
                <!-- Graduation Cap -->
                <g id="cap" transform="translate(3 -15)">
                  <path d="M105 54 V76" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
                  <circle cx="105" cy="81" r="5" fill="currentColor"/>
                  <path d="M22 53 L67 32 L112 53 L67 75 Z" stroke-width="4" stroke="currentColor" stroke-linecap="round" fill="none"/>
                  <path d="M38 61 V79 C53 92 81 92 96 79 V61 L67 76 Z" stroke-width="4" stroke="currentColor" stroke-linecap="round" fill="none"/>
                </g>

                <!-- Open Book -->
                <g id="open-book" transform="scale(0.8) translate(-33 -30)">
                  <path d="M57 125 C77 119 99 123 119 137 L119 184 C98 171 76 168 57 175 Z" stroke-width="4" stroke="currentColor" stroke-linecap="round" fill="none"/>
                  <path d="M121 137 C141 123 163 119 183 125 L183 175 C164 168 142 171 121 184 Z" stroke-width="4" stroke="currentColor" stroke-linecap="round" fill="none"/>
                  <path d="M120 137 L120 185" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
                </g>
              </g>
            </svg>
          </div>
          <div class="brand-name">
            <span>Skill</span>
            <span>Earn.</span>
          </div>
        </div>

        <div class="about">
          <h1>Stop wondering where to start.</h1>
          <p>Tell us what you want to learn. Get a day-by-day plan, a checklist and the right resources.</p>
          <div class="famous-skills">
            <div class="skill">Karate</div>
            <div class="skill">Chess</div>
            <div class="skill">Guitar</div>
            <div class="skill">Video Editing</div>
          </div>
        </div>
      </div>

      <form action="">
          <h2>Welcome back</h2>
          <p>Log in to continue your learning.</p>

          <div class="error">Invalid email or password</div>

          <div class="input-field">
            <label for="email">Email</label>
            <input type="email" name="email" id="email">
          </div>

          <div class="input-field">
            <label for="password">Password</label>
            <input type="password" name="password" id="password">
          </div>

          <button>Log In</button>
          
          <div class="foot">
            <p>New here? <a href="">Create an account</a></p>
          </div>
      </form>
    </div>
  </body>
</html>
